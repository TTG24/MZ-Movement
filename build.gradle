plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

// The jar is mz-movement-<version>.jar (the mod id stays "tacticalmovement", so settings and the server link keep working)
base {
	archivesName = "mz-movement"
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"tacticalmovement" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

// guide.json for the server's /client/info.json (and through it the website's mod guide): the version, the default
// keys (read from TacticalMovementClient's KeyMappings and their names from en_us.json) and the newest section of
// RELEASE_NOTES.md. Made on every build, so the guide never needs editing by hand.
def guideDir = layout.buildDirectory.dir("generated/guide")
def generateGuide = tasks.register("generateGuide") {
	def clientSrc = file("src/client/java/com/mzcod/tacticalmovement/client/TacticalMovementClient.java")
	def lang = file("src/main/resources/assets/tacticalmovement/lang/en_us.json")
	def notes = file("RELEASE_NOTES.md")
	def version = project.version
	inputs.files(clientSrc, lang)
	inputs.property "version", version
	if (notes.exists()) inputs.file(notes)
	outputs.dir(guideDir)
	doLast {
		def names = new groovy.json.JsonSlurper().parse(lang)
		def keys = []
		(clientSrc.text =~ /"(key\.tacticalmovement\.\w+)",\s*InputConstants\.Type\.KEYBOARD,\s*InputConstants\.KEY_(\w+)/).each { m ->
			String action = names[m[1]] ?: m[1]
			if (action.contains("(operators)")) return
			String code = m[2]
			Map special = [GRAVE: "`", SPACE: "Space", TAB: "Tab", LSHIFT: "Left Shift", LCONTROL: "Left Ctrl", LALT: "Left Alt",
				LEFT_SHIFT: "Left Shift", LEFT_CONTROL: "Left Ctrl", LEFT_ALT: "Left Alt", CAPSLOCK: "Caps Lock"]
			String key = special[code] ?: code.split("_").collect { it.length() == 1 ? it : it.toLowerCase().capitalize() }.join(" ")
			keys << [key: key, action: action]
		}
		if (keys.isEmpty()) throw new GradleException("generateGuide: no key mappings found in " + clientSrc)
		String top = ""
		if (notes.exists()) {
			def out = []
			boolean inside = false
			for (String line : notes.readLines("UTF-8")) {
				if (line.startsWith("# ")) {
					if (inside) break
					inside = true
				}
				if (inside) out << line
			}
			top = out.join("\n").trim()
		}
		def f = guideDir.get().file("assets/tacticalmovement/guide.json").asFile
		f.parentFile.mkdirs()
		f.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
			displayName: "MZ-Movement",
			version    : version.toString(),
			// Where the keys are listed in Options > Controls > Key Binds
			keyCategory: names["key.category.tacticalmovement.movement"] ?: "MZ-Movement",
			keys       : keys,
			notes      : top
		])), "UTF-8")
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
	from(generateGuide)
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
