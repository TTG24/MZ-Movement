# Builds the mod and publishes a GitHub release when a version tag (v*) is pushed.
name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      - run: ./gradlew build
      - name: create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JAR=$(ls build/libs/tactical-movement-*[0-9].jar)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # The tag was pushed again: refresh the attached jar instead of failing.
            gh release upload "$GITHUB_REF_NAME" "$JAR" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$JAR"               --title "Tactical Movement ${GITHUB_REF_NAME#v}"               --notes "Fabric mod for Minecraft 26.3. Install it with Fabric API on the client (and the server, if the server runs the mod). For Paper/Purpur servers, use the companion Tactical Movement plugin so players without the mod still get stamina and the prone model."
          fi
