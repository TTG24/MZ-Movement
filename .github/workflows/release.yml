# Builds the mod and publishes a GitHub release when a version tag (v*) is pushed.
name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      - run: ./gradlew build
      - name: create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JAR=$(ls build/libs/tactical-movement-*[0-9].jar)
          # Notes: the top (newest) section of RELEASE_NOTES.md, or a short default.
          if [ -f RELEASE_NOTES.md ]; then
            awk 'f && /^# /{exit} /^# /{f=1} f' RELEASE_NOTES.md > NOTES.md
          fi
          if [ ! -s NOTES.md ]; then
            echo "Fabric mod for Minecraft 26.3. Install it with Fabric API." > NOTES.md
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # The tag was pushed again: refresh the attached jar instead of failing.
            gh release upload "$GITHUB_REF_NAME" "$JAR" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$JAR" --title "MZ-Movement ${GITHUB_REF_NAME#v}" --notes-file NOTES.md
          fi
